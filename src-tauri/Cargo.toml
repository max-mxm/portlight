[package]
name = "portlight"
version = "0.1.0"
edition = "2021"
[lib]
name = "portlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
