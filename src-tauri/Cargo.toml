[package]
name = "portlight"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local macOS app to find and stop forgotten servers and occupied ports."
[lib]
name = "portlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Already built by Tauri: quits applications the way ⌘Q does.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
